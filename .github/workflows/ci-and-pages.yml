name: CI and GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
      VITE_USE_HASH_ROUTING: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Node.js runtime
        run: pnpm check-runtime

      - name: Type-check repository scripts
        run: pnpm check-scripts

      - name: Check source conventions
        run: pnpm check-code

      - name: Check workspace package boundaries
        run: pnpm check-packages

      - name: Check layer dependencies
        run: pnpm check-layers

      - name: Check spelling
        run: pnpm check-spell

      - name: Lint workspace packages
        run: pnpm lint-packages

      - name: Test workspace packages
        run: pnpm test

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports
          path: |
            apps/agent-fe/coverage
            packages/agent-core/coverage
            packages/markdown/coverage
            packages/utils/coverage
            packages/web-search-core/coverage
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            apps/agent-fe/test-results
            packages/agent-core/test-results
            packages/markdown/test-results
            packages/utils/test-results
            packages/web-search-core/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Build workspace
        run: pnpm build

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/agent-fe/dist

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
